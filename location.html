<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Find Us</title>
    <link rel="stylesheet" href="style3.css"> 
</head>
<body>
    <header class="location-header">
        <a href="index.html" class="location-brand">
            <img src="logo.webp" alt="Mr.Burger" fetchpriority="high">
        </a>
        <div class="location-actions">
            <a href="index.html" class="back-link">Back to home</a>
            <a href="digitalmenu.html" class="menu-link">View menu</a>
        </div>
    </header>

    <main class="location-page">
        <div class="location-heading">
            <span>MR.BURGER</span>
            <h1>Find us</h1>
            <p>Order directly or find us in Tripoli, Lebanon.</p>
        </div>

        <div class="location-layout">
            <section class="map-section" aria-label="Mr.Burger location map">
                <iframe
                    src="https://www.google.com/maps?q=Mr.Burger+Tripoli+Lebanon&output=embed"
                    title="Find Mr.Burger in Tripoli, Lebanon"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
                <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=Mr.Burger+Tripoli+Lebanon" target="_blank">Open in Google Maps</a>
            </section>

            <section class="location-info">
                <div class="info-block">
                    <span class="info-label">Call for delivery</span>
                    <a class="phone-link" href="tel:+96181313067">+961 81 31 30 67</a>
                </div>

                <div class="info-block">
                    <span class="info-label">Order online</span>
                    <a class="whatsapp-link" href="https://wa.me/+96181313067" target="_blank">Order on WhatsApp</a>
                </div>

                <div class="info-block">
                    <span class="info-label">Available on</span>
                    <div class="platform-logos">
                        <img src="srcitems/toters.webp" alt="Toters" loading="lazy">
                        <img src="srcitems/markit.webp" alt="Market" loading="lazy">
                        <img src="srcitems/voom.webp" alt="Voom" loading="lazy">
                    </div>
                </div>

                <div class="info-block hours-block">
                    <span class="info-label">Opening hours</span>
                    <p>Contact us for today's hours.</p>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
